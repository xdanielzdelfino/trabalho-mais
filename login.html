<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar | Trabalho+</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <a class="pular" href="#conteudo">Pular para o conteúdo</a>

  <header class="topo">
    <div class="container">
      <a href="index.html" class="marca">Trabalho<span>+</span></a>
      <button type="button" class="menu-btn" aria-label="Abrir menu" aria-expanded="false" aria-controls="menu">☰</button>
      <nav id="menu" aria-label="Menu principal">
        <a href="index.html">Início</a>
        <a href="vagas.html">Vagas</a>
        <a href="login.html" aria-current="page">Entrar</a>
      </nav>
    </div>
  </header>

  <main id="conteudo" class="container bloco">
    <form id="form-login" class="formulario">
      <h1>Entrar na conta</h1>

      <label for="email" class="rotulo">E-mail</label>
      <input type="email" id="email" class="campo" required autocomplete="email">

      <label for="senha" class="rotulo">Senha</label>
      <input type="password" id="senha" class="campo" required autocomplete="current-password">

      <p id="msg-login" class="msg" role="alert"></p>

      <button type="submit" class="botao">Entrar</button>
      <p class="ajuda">Teste: daniel@email.com / 123456</p>
      <p class="ajuda">Não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
    </form>
  </main>

  <footer class="rodape">
    <div class="container">
      <p>Trabalho+ — Trabalho de Transformação Digital | Daniel Leite Delfino | ODS 8</p>
    </div>
  </footer>

  <script src="js/dados.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
